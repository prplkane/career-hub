name: Full qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Full Windows qualification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for independent development tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Use canonical runner-owned temporary fixtures
        shell: python
        run: |
          import os
          from pathlib import Path

          print(f"Inherited TEMP={os.environ.get('TEMP')} TMP={os.environ.get('TMP')}")
          fixture_root = (Path(os.environ["RUNNER_TEMP"]) / "career-hub-test-temp").resolve()
          fixture_root.mkdir()
          fixture_root = fixture_root.resolve(strict=True)
          print(f"Canonical test temporary root: {fixture_root}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment_file:
              environment_file.write(f"TEMP={fixture_root}\nTMP={fixture_root}\n")

      - name: Install hash-pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Reject private or personal tracked artifacts
        run: python scripts/check_public_tree.py

      - name: Run development-tool tests
        run: python -m unittest discover -s tests -q

      - name: Set up pinned native Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet native backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run native backend regression tests
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: go test -p 2 ./cmd/... ./internal/...

      - name: Set up Node for desktop and rendered smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install locked desktop dependencies and Electron
        working-directory: desktop
        run: npm ci

      - name: Initialize pinned Electron binary for direct-executable smoke
        working-directory: desktop
        run: node node_modules/electron/install.js

      - name: Run UI state and loading tests
        run: npm run test:fast

      - name: Run desktop foundation tests
        working-directory: desktop
        run: npm test

      - name: Check desktop pinned foundation
        working-directory: desktop
        run: npm run check

      - name: Install locked browser-smoke dependency
        run: npm ci --ignore-scripts

      - name: Install locked Chromium runtime
        run: npx playwright install chromium

      - name: Build and qualify native supervisor integration
        run: python -m scripts.local_checks --profile native

      - name: Run native desktop rendered smoke
        env:
          CAREERHUB_DESKTOP_TEST_EMPTY_PROFILE: "1"
        run: npm run smoke:native-desktop

      - name: Run native Competency Graph rendered smoke
        run: npm run smoke:competency

      - name: Run desktop recovery and diagnostics rendered smokes
        run: |
          npm run smoke:desktop-recovery
          npm run smoke:diagnostics-history

      - name: Run workflow scenarios using the fresh build
        timeout-minutes: 1
        env:
          CAREER_HUB_SIDECAR_BINARY: packaging/dist/go-onedir/career-hub-sidecar/career-hub-sidecar.exe
        run: npm run test:workflows

  extension:
    # The rendered browser-extension smoke drives the packaged desktop app on
    # port 8766 with a real Chromium, so it runs here on request, not in CI.
    name: Browser extension qualification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for the extension build script
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned native Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node for the desktop package and rendered smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install locked desktop dependencies and Electron
        working-directory: desktop
        run: npm ci

      - name: Build native sidecar from the checked source
        run: npm --prefix desktop run build:go-sidecar

      - name: Package the desktop app the smoke drives
        working-directory: desktop
        run: npm run package

      - name: Install locked browser-smoke dependency
        run: npm ci --ignore-scripts

      - name: Install locked Chromium runtime
        run: npx playwright install chromium

      - name: Build the browser extension packages
        run: python -m scripts.build_browser_extension

      - name: Run the packaged browser extension smoke
        run: npm run qualify:extension

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true
