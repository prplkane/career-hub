name: Release

# A v*.*.* tag on main of the public repository builds the Windows Squirrel
# update package and publishes it as a GitHub Release of that same repository,
# which installed apps read anonymously as their update feed. The build needs
# nothing private, so it runs on the public repository's free Actions minutes;
# the private source copy of this file never publishes. Pull requests that
# change it or the packaging configuration run a build-only dry run.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/assets/**
      - desktop/forge.config.js
      - desktop/src/installer_contract.js

permissions:
  checks: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # dev unless the repository variable CAREER_HUB_RELEASE_CHANNEL overrides it.
  RELEASE_CHANNEL: ${{ vars.CAREER_HUB_RELEASE_CHANNEL || 'dev' }}

jobs:
  build:
    name: Windows update package
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read  # The build never writes; only the publish job does.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:PUBLISH -eq "true") {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version." }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit on main." }
            # Never publish a commit whose required CI check has not passed.
            $gate = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?check_name=Tests%20and%20public-tree%20gate" --jq ".check_runs[].conclusion"
            if ($LASTEXITCODE -ne 0 -or @($gate) -notcontains "success") {
              throw "CI ('Tests and public-tree gate') has not passed on $env:GITHUB_SHA. Wait for it to pass, then re-run this workflow."
            }
          }
          # The channel picks the installed app and its Data Home.
          if ($env:RELEASE_CHANNEL -notin @("dev", "stable")) {
            throw "The repository variable CAREER_HUB_RELEASE_CHANNEL must be dev or stable."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          # Installed apps read the feed from this repository's latest release.
          "UPDATE_FEED_URL=https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download" >> $env:GITHUB_ENV

      - name: Set up pinned native Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked desktop dependencies and Electron
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Build native sidecar from the checked source
        run: npm --prefix desktop run build:go-sidecar

      - name: Build the Squirrel package with the update feed
        working-directory: desktop
        shell: pwsh
        env:
          CAREER_HUB_UPDATE_FEED_URL: ${{ env.UPDATE_FEED_URL }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/prepare-package.cjs $env:RELEASE_CHANNEL
          npx electron-forge make --platform=win32 --arch=x64

      - name: Collect and hash release files
        shell: pwsh
        run: |
          $made = Join-Path $PWD "desktop/out/make/squirrel.windows/x64"
          $out = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Path $out | Out-Null
          $full = @(Get-ChildItem -LiteralPath $made -File -Filter "*-$env:RELEASE_VERSION-full.nupkg")
          $setup = @(Get-ChildItem -LiteralPath $made -File -Filter "*Setup.exe")
          $delta = @(Get-ChildItem -LiteralPath $made -File -Filter "*-delta.nupkg")
          if ($full.Count -ne 1 -or $setup.Count -ne 1 -or $delta.Count -ne 0 -or -not (Test-Path (Join-Path $made "RELEASES"))) {
            Get-ChildItem -LiteralPath $made | Format-Table Name, Length
            throw "Expected one RELEASES file, one full package, one Setup.exe and no delta package."
          }
          # RELEASES names the package file, so the package keeps its name; Setup.exe
          # gets a space-free name because release asset names cannot contain spaces.
          Copy-Item (Join-Path $made "RELEASES") $out
          Copy-Item $full[0].FullName $out
          Copy-Item $setup[0].FullName (Join-Path $out "CareerHub-$env:RELEASE_CHANNEL-$env:RELEASE_VERSION-Setup.exe")
          # LF line endings, so `sha256sum -c SHA256SUMS.txt` works on every platform.
          $sums = Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $out "SHA256SUMS.txt"), (($sums -join "`n") + "`n"))
          Get-Content (Join-Path $out "SHA256SUMS.txt")
          "RELEASE_DIR=$out" >> $env:GITHUB_ENV

      - name: Keep the release files for the publish job
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release and update feed
    needs: build
    # Only a tag run of the public repository publishes. The private source copy
    # of this workflow never sees a public tag, and its own tags stop here.
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment admits only v* tags, so nothing else can reach the
    # write-capable token below.
    environment: release
    permissions:
      contents: write  # Creates the release and uploads its assets.
    steps:
      - name: Check out source for the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      - name: Publish the release and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -Raw VERSION).Trim()
          $changelog = Get-Content -Raw CHANGELOG.md
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no [$version] section." }
          $notes = Join-Path $env:RUNNER_TEMP "notes.md"
          # Links to the private source repository's pull requests would not open publicly.
          $body = $match.Groups[1].Value.Trim() -replace '\s*\((?:\s*\[#\d+\]\(https://github\.com/[^/]+/[^/]+/pull/\d+\),?)+\s*\)', ''
          $source = "https://github.com/$env:GITHUB_REPOSITORY"
          $badge = "[![View source code](https://img.shields.io/badge/View-source%20code-24292f?logo=github&style=for-the-badge)]($source)"
          @(
            $badge, "",
            "Install ``CareerHub-$env:RELEASE_CHANNEL-$version-Setup.exe`` below; installed builds update from **Settings**. Checksums are in ``SHA256SUMS.txt``.", "",
            $body, "",
            "Source for this release: [$env:GITHUB_REF_NAME]($source/tree/$env:GITHUB_REF_NAME)."
          ) | Set-Content -Encoding utf8 $notes
          $files = Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --title "Career Hub $version" --notes-file $notes --latest
