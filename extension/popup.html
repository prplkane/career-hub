<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career Hub Capture</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect class="brand-mark-tile" width="16" height="16"/><g class="brand-mark-ink"><rect x="6" y="3" width="4" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/><rect x="2" y="5" width="12" height="3"/><rect x="2" y="8" width="5" height="1"/><rect x="9" y="8" width="5" height="1"/><rect x="2" y="9" width="12" height="3"/></g></svg>
          <div class="brand-copy">
            <strong>Career Hub</strong>
          </div>
        </div>
        <span class="status-badge" id="connection-badge" aria-live="polite">Checking…</span>
      </header>

      <section class="capture-view" id="capture-view">
        <div class="state-card" id="connection-card" data-tone="warning" hidden>
          <strong id="connection-title"></strong>
          <p id="connection-message"></p>
          <div class="state-actions">
            <button class="secondary-button compact-button" id="connection-action" type="button" hidden></button>
          </div>
        </div>

        <div class="card tab-card" id="tab-preview">
          <p class="eyebrow">This page</p>
          <strong id="tab-title">Loading current tab…</strong>
          <span id="tab-host">Checking page address</span>
        </div>

        <div class="capture-actions" aria-label="Save this job">
          <button class="primary-button" id="page-button" type="button" disabled>
            Save this job
          </button>
          <button class="secondary-button" id="prepare-application-button" type="button" disabled>
            Save and open workspace
          </button>
          <button class="secondary-button" id="selection-button" type="button" disabled hidden>
            Save selection
          </button>
          <p class="selection-status" id="selection-status" aria-live="polite">Checking selection…</p>
          <button class="text-button" id="link-button" type="button" disabled>
            Save link only
          </button>
        </div>

        <div class="tool-row" aria-label="Application tools">
          <button class="secondary-button compact-button" id="helper-button" type="button" title="Open the application assistant">
            Application assistant
          </button>
          <button class="secondary-button compact-button" id="arm-application-button" type="button" disabled>
            Track submission
          </button>
          <button class="primary-button compact-button" id="open-applications-button" type="button" hidden>
            Review submission
          </button>
        </div>
        <p class="note" id="application-session-status" aria-live="polite" hidden></p>
      </section>

      <section
        class="result-view"
        id="result-view"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <div class="result-heading">
          <svg class="result-icon result-icon-success" id="success-icon" viewBox="0 0 48 48" aria-hidden="true" hidden>
            <circle cx="24" cy="24" r="19"></circle>
            <path d="m15.5 24.5 5.5 5.5 12-13"></path>
          </svg>
          <svg class="result-icon result-icon-error" id="error-icon" viewBox="0 0 48 48" aria-hidden="true" hidden>
            <circle cx="24" cy="24" r="19"></circle>
            <path d="M24 14v13"></path>
            <path d="M24 34h.01"></path>
          </svg>
          <div>
            <h1 id="result-title"></h1>
            <p id="result-message"></p>
          </div>
        </div>
        <div class="assessment-receipt" id="assessment-receipt" hidden>
          <div class="receipt-heading">
            <span class="receipt-status" id="receipt-status"></span>
            <span class="receipt-count" id="receipt-count"></span>
          </div>
          <p class="receipt-extra-step-count" id="receipt-extra-step-count" hidden></p>
          <p class="receipt-contact-candidate-count" id="receipt-contact-candidate-count" hidden></p>
          <ul class="receipt-findings" id="receipt-findings"></ul>
          <p class="receipt-note" id="receipt-note"></p>
        </div>
        <div class="result-actions">
          <button class="primary-button" id="review-button" type="button" hidden>Review in Career Hub</button>
          <button class="primary-button" id="result-applications-button" type="button" hidden>Open Applications</button>
          <button class="secondary-button" id="retry-button" type="button" hidden>Retry</button>
          <button class="text-button" id="back-button" type="button">Back</button>
        </div>
      </section>
    </main>
    <script src="browser-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
